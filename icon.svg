<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d6efd"/>
      <stop offset="100%" stop-color="#0a58ca"/>
    </linearGradient>
    <linearGradient id="carG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0eaff"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- พื้นหลังสี่เหลี่ยมมุมโค้ง -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- เอียงแสงด้านบน -->
  <path d="M0 0 L512 0 L512 200 Q256 260 0 200 Z" fill="#ffffff" opacity="0.08"/>

  <!-- โล่ด้านหลัง -->
  <path d="M256 90 L380 140 Q400 148 400 170 L400 300 Q400 380 256 435 Q112 380 112 300 L112 170 Q112 148 132 140 Z"
        fill="url(#shield)" opacity="0.95" filter="url(#ds)"/>

  <!-- ตัวรถด้านหน้าโล่ -->
  <g transform="translate(0, 20)">
    <!-- ตัวถัง -->
    <path d="M140 290 Q140 260 165 245 L200 210 Q215 200 240 200 L300 200 Q320 200 335 212 L365 245 Q385 260 385 290 L385 310 Q385 325 370 325 L155 325 Q140 325 140 310 Z"
          fill="url(#carG)"/>
    <!-- กระจก -->
    <path d="M215 210 L245 210 L245 245 L195 245 Z" fill="#0a58ca" opacity="0.85"/>
    <path d="M260 210 L295 210 L320 245 L260 245 Z" fill="#0a58ca" opacity="0.85"/>
    <!-- ไฟหน้า -->
    <rect x="155" y="270" width="30" height="18" rx="6" fill="#fbbf24"/>
    <rect x="347" y="270" width="30" height="18" rx="6" fill="#fbbf24"/>
    <!-- ล้อ -->
    <circle cx="195" cy="330" r="22" fill="#1e293b"/>
    <circle cx="195" cy="330" r="10" fill="#cbd5e1"/>
    <circle cx="330" cy="330" r="22" fill="#1e293b"/>
    <circle cx="330" cy="330" r="10" fill="#cbd5e1"/>
  </g>

  <!-- เครื่องหมายถูก/ติ๊ก (สัญลักษณ์รับซื้อ) -->
  <g transform="translate(350, 120)">
    <circle cx="0" cy="0" r="50" fill="#fbbf24" stroke="#ffffff" stroke-width="6"/>
    <path d="M-22 0 L-6 18 L24 -18" stroke="#7c2d12" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>